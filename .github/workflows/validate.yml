name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main (2026-08-30)
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master (2026-09-10)

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements/latest/test-requirements.txt
      - name: Verify Python lock files are reproducible
        run: |
          mkdir -p "${RUNNER_TEMP}/lock-check/requirements/latest" "${RUNNER_TEMP}/lock-check/requirements/minimum"
          cp requirements/latest/test-requirements.in "${RUNNER_TEMP}/lock-check/requirements/latest/test-requirements.in"
          cp requirements/latest/test-requirements.txt "${RUNNER_TEMP}/lock-check/requirements/latest/test-requirements.txt"
          cp requirements/minimum/test-requirements.in "${RUNNER_TEMP}/lock-check/requirements/minimum/test-requirements.in"
          cp requirements/minimum/test-requirements.txt "${RUNNER_TEMP}/lock-check/requirements/minimum/test-requirements.txt"
          (
            cd "${RUNNER_TEMP}/lock-check"
            uv pip compile requirements/latest/test-requirements.in --python-version 3.14.2 --python-platform x86_64-manylinux_2_28 --generate-hashes --output-file requirements/latest/test-requirements.txt
            uv pip compile requirements/minimum/test-requirements.in --python-version 3.14.2 --python-platform x86_64-manylinux_2_28 --generate-hashes --output-file requirements/minimum/test-requirements.txt
          )
          diff -u requirements/latest/test-requirements.txt "${RUNNER_TEMP}/lock-check/requirements/latest/test-requirements.txt"
          diff -u requirements/minimum/test-requirements.txt "${RUNNER_TEMP}/lock-check/requirements/minimum/test-requirements.txt"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function

  runtime-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_version: "2026.3.0"
            requirements: "requirements/minimum/test-requirements.txt"
            pytest_args: ""
          - ha_version: "2026.9.3"
            requirements: "requirements/latest/test-requirements.txt"
            pytest_args: "-o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r "${{ matrix.requirements }}"
      - run: pytest tests_integration/test_integration_smoke.py tests/test_blueprint.py -v ${{ matrix.pytest_args }}

  integration-smoke:
    runs-on: ubuntu-latest
    needs: runtime-matrix
    steps:
      - run: echo "All supported Home Assistant runtime checks passed"

  tests-min-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements/minimum/test-requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit
      - run: npm test
      - run: npm run test:coverage
      - run: npm run check:bundle
      - name: Remove unrelated Chrome APT source
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/google-chrome.sources.save
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
