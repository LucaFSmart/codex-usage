version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      codeql:
        applies-to: version-updates
        patterns:
          - github/codeql-action/*
      codeql-security:
        applies-to: security-updates
        patterns:
          - github/codeql-action/*
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/*"
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # typescript-eslint pins its supported TypeScript range; a major
      # TypeScript bump has to wait for that peer range to widen.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /requirements/latest
    schedule:
      interval: monthly
    # Files in this directory contain `test` in their names so GitHub records
    # the complete Home Assistant CI environment as development-only.
  - package-ecosystem: pip
    directory: /requirements/minimum
    schedule:
      interval: monthly
    ignore:
      # The supported Home Assistant floor is advanced deliberately after a
      # compatibility review. Other direct and transitive fixes remain tracked.
      - dependency-name: homeassistant
