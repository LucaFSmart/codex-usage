name: Bug report
description: Report a reproducible Codex Usage integration problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste tokens, device codes, cookies, or unredacted diagnostics."
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 0.6.4
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.3
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: ChatGPT plan
      options: [Free, Go, Plus, Pro, Business, Enterprise, Edu, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
