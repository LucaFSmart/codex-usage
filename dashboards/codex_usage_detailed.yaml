# Replace every example entity ID below with the ID from Developer Tools > States.
type: custom:button-card
variables:
  plan_entity: sensor.codex_usage_plan
  five_hour_usage_entity: sensor.codex_usage_5_hour_usage
  five_hour_remaining_entity: sensor.codex_usage_5_hour_remaining
  five_hour_reset_entity: sensor.codex_usage_5_hour_reset
  weekly_usage_entity: sensor.codex_usage_weekly_usage
  weekly_remaining_entity: sensor.codex_usage_weekly_remaining
  weekly_reset_entity: sensor.codex_usage_weekly_reset
  weekly_pace_entity: sensor.codex_usage_weekly_usage_pace
  available_reset_credits_entity: sensor.codex_usage_available_usage_resets
  credit_balance_entity: sensor.codex_usage_credit_balance
  spend_used_entity: sensor.codex_usage_spend_used
  spend_limit_entity: sensor.codex_usage_spend_limit
  spend_remaining_entity: sensor.codex_usage_spend_remaining
  spend_usage_entity: sensor.codex_usage_spend_usage
  spend_reset_entity: sensor.codex_usage_spend_reset
  lifetime_tokens_entity: sensor.codex_usage_lifetime_tokens
  total_threads_entity: sensor.codex_usage_total_threads
  current_streak_entity: sensor.codex_usage_current_streak
  fast_mode_usage_entity: sensor.codex_usage_fast_mode_usage
  reasoning_effort_entity: sensor.codex_usage_most_used_reasoning_effort
  reasoning_effort_share_entity: sensor.codex_usage_most_used_reasoning_effort_share
  rate_limit_entity: binary_sensor.codex_usage_rate_limit_reached
  credits_available_entity: binary_sensor.codex_usage_credits_available
  unlimited_credits_entity: binary_sensor.codex_usage_unlimited_credits
  credit_overage_limit_reached_entity: binary_sensor.codex_usage_credit_overage_limit_reached
  spend_limit_reached_entity: binary_sensor.codex_usage_spend_limit_reached
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
hold_action:
  action: none
styles:
  card:
    - padding: 18px
    - border-radius: 22px
    - background: var(--ha-card-background, var(--card-background-color))
    - border: 1px solid var(--divider-color)
    - box-shadow: var(--ha-card-box-shadow, none)
  grid:
    - grid-template-areas: '"details"'
    - grid-template-columns: 1fr
  custom_fields:
    details:
      - grid-area: details
      - width: 100%
custom_fields:
  details: |
    [[[
      const missing = new Set(['', 'unknown', 'unavailable']);
      const raw = (id) => states[id]?.state;
      const present = (value) => value !== undefined && value !== null
        && !missing.has(String(value).toLowerCase());
      const number = (id) => {
        const value = raw(id);
        if (!present(value)) return null;
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : null;
      };
      const binary = (id) => present(raw(id)) ? raw(id) === 'on' : null;
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[character]);
      const clamp = (value) => Math.max(0, Math.min(100, value));
      const usageColor = (value) => value >= 90 ? '#ef4444' : value >= 75 ? '#f59e0b' : '#38bdf8';
      const locale = hass.locale?.language || hass.language || navigator.language;
      const formatNumber = (value, digits = 0) => value === null ? 'Not reported' : value.toFixed(digits);
      const formatDate = (id) => {
        const value = raw(id);
        if (!present(value)) return 'Not reported';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return 'Not reported';
        return escapeHtml(date.toLocaleString(locale, {
          weekday: 'short', day: '2-digit', month: '2-digit',
          hour: '2-digit', minute: '2-digit'
        }));
      };
      const panel = (title, body) => `
        <section style="min-width:0;padding:14px;border:1px solid var(--divider-color);border-radius:16px;background:var(--secondary-background-color);">
          <div style="font-size:11px;font-weight:750;letter-spacing:.04em;color:var(--secondary-text-color);">${title}</div>
          ${body}
        </section>`;
      const usagePanel = (title, usageId, remainingId, resetId) => {
        const usage = number(usageId);
        const remaining = number(remainingId);
        if (usage === null) return panel(title, `
          <div style="margin-top:10px;font-size:15px;font-weight:700;color:var(--secondary-text-color);">Currently not reported by OpenAI</div>
          <div style="margin-top:12px;font-size:11px;color:var(--secondary-text-color);">Reset: ${formatDate(resetId)}</div>`);
        const color = usageColor(usage);
        return panel(title, `
          <div style="display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:8px;">
            <div style="font-size:29px;font-weight:850;line-height:1;color:var(--primary-text-color);">${usage.toFixed(0)}%</div>
            <div style="font-size:11px;text-align:right;color:var(--secondary-text-color);">Remaining<br><b style="color:var(--primary-text-color);">${remaining === null ? '—' : `${remaining.toFixed(0)}%`}</b></div>
          </div>
          <div style="height:8px;margin-top:12px;overflow:hidden;border-radius:999px;background:var(--divider-color);">
            <div style="height:100%;width:${clamp(usage)}%;border-radius:999px;background:${color};"></div>
          </div>
          <div style="margin-top:11px;font-size:11px;color:var(--secondary-text-color);">Reset: ${formatDate(resetId)}</div>`);
      };

      const fiveHour = number(variables.five_hour_usage_entity);
      const weekly = number(variables.weekly_usage_entity);
      const limitReached = binary(variables.rate_limit_entity) === true;
      const spendLimitReached = binary(variables.spend_limit_reached_entity) === true;
      const overageReached = binary(variables.credit_overage_limit_reached_entity) === true;
      const maximum = Math.max(fiveHour ?? -1, weekly ?? -1);
      const planRaw = raw(variables.plan_entity);
      const plan = present(planRaw) ? escapeHtml(planRaw) : 'Plan not reported';

      let status = 'Available';
      let statusColor = '#22c55e';
      if (limitReached || spendLimitReached || overageReached) {
        status = 'Limit reached';
        statusColor = '#ef4444';
      } else if (fiveHour === null && weekly === null) {
        status = 'No usage data';
        statusColor = '#94a3b8';
      } else if (maximum >= 90) {
        status = 'Almost full';
        statusColor = '#ef4444';
      } else if (maximum >= 75) {
        status = 'High usage';
        statusColor = '#f59e0b';
      }

      const pace = number(variables.weekly_pace_entity);
      let paceBody = '<div style="margin-top:10px;font-size:15px;font-weight:700;color:var(--secondary-text-color);">Not reported</div>';
      if (pace !== null) {
        const tolerance = 0.05;
        const paceLabel = pace > tolerance ? 'ahead of pace' : pace < -tolerance ? 'behind pace' : 'on pace';
        const paceColor = pace > 10 ? '#ef4444' : pace > 0 ? '#f59e0b' : '#22c55e';
        const signed = pace > 0 ? `+${pace.toFixed(1)}` : pace.toFixed(1);
        paceBody = `
          <div style="margin-top:8px;font-size:25px;font-weight:800;color:${paceColor};">${signed} pp</div>
          <div style="margin-top:4px;font-size:12px;color:var(--secondary-text-color);">${paceLabel}</div>
          <div style="margin-top:9px;font-size:10px;line-height:1.35;color:var(--secondary-text-color);">Usage minus the elapsed share of the weekly window</div>`;
      }

      const resetsBody = `
        <div style="margin-top:9px;font-size:12px;line-height:1.65;color:var(--secondary-text-color);">
          <b style="color:var(--primary-text-color);">5-hour:</b> ${formatDate(variables.five_hour_reset_entity)}<br>
          <b style="color:var(--primary-text-color);">Weekly:</b> ${formatDate(variables.weekly_reset_entity)}<br>
          <b style="color:var(--primary-text-color);">Spending:</b> ${formatDate(variables.spend_reset_entity)}
        </div>`;

      const resetCredits = number(variables.available_reset_credits_entity);
      const creditBalance = number(variables.credit_balance_entity);
      const creditsAvailable = binary(variables.credits_available_entity);
      const unlimitedCredits = binary(variables.unlimited_credits_entity);
      const creditDataReported = creditBalance !== null || creditsAvailable !== null || unlimitedCredits !== null || overageReached;
      let creditBody = '<div style="margin-top:10px;font-size:13px;color:var(--secondary-text-color);">Currently not reported by OpenAI</div>';
      if (creditDataReported || resetCredits !== null) {
        const creditState = unlimitedCredits === true ? 'Unlimited' : creditsAvailable === true ? 'Available' : overageReached ? 'Overage limit reached' : 'No extra credits';
        creditBody = `
          <div style="margin-top:9px;font-size:12px;line-height:1.65;color:var(--secondary-text-color);">
            <b style="color:var(--primary-text-color);">Balance:</b> ${creditBalance === null ? '—' : creditBalance}<br>
            <b style="color:var(--primary-text-color);">Status:</b> ${creditState}<br>
            <b style="color:var(--primary-text-color);">Usage resets:</b> ${resetCredits === null ? '—' : resetCredits}
          </div>`;
      }

      const spendUsed = number(variables.spend_used_entity);
      const spendLimit = number(variables.spend_limit_entity);
      const spendRemaining = number(variables.spend_remaining_entity);
      const spendUsage = number(variables.spend_usage_entity);
      const spendReported = [spendUsed, spendLimit, spendRemaining, spendUsage].some((value) => value !== null) || spendLimitReached;
      let spendBody = '<div style="margin-top:10px;font-size:13px;color:var(--secondary-text-color);">Currently not reported by OpenAI</div>';
      if (spendReported) {
        const spendColor = spendLimitReached ? '#ef4444' : spendUsage !== null ? usageColor(spendUsage) : 'var(--primary-text-color)';
        spendBody = `
          <div style="margin-top:9px;font-size:12px;line-height:1.65;color:var(--secondary-text-color);">
            <b style="color:${spendColor};">Usage:</b> ${spendUsage === null ? '—' : `${formatNumber(spendUsage, 0)}%`}<br>
            <b style="color:var(--primary-text-color);">Used:</b> ${spendUsed === null ? '—' : spendUsed}<br>
            <b style="color:var(--primary-text-color);">Remaining:</b> ${spendRemaining === null ? '—' : spendRemaining}<br>
            <b style="color:var(--primary-text-color);">Limit:</b> ${spendLimit === null ? '—' : spendLimit}
          </div>`;
      }

      const lifetimeTokens = number(variables.lifetime_tokens_entity);
      const totalThreads = number(variables.total_threads_entity);
      const currentStreak = number(variables.current_streak_entity);
      const fastMode = number(variables.fast_mode_usage_entity);
      const reasoningRaw = raw(variables.reasoning_effort_entity);
      const reasoning = present(reasoningRaw) ? escapeHtml(reasoningRaw) : null;
      const reasoningShare = number(variables.reasoning_effort_share_entity);
      const profileReported = [lifetimeTokens, totalThreads, currentStreak, fastMode, reasoningShare]
        .some((value) => value !== null) || reasoning !== null;
      let profileBody = '<div style="margin-top:10px;font-size:13px;color:var(--secondary-text-color);">Currently not reported by OpenAI</div>';
      if (profileReported) {
        profileBody = `
          <div style="margin-top:9px;font-size:12px;line-height:1.65;color:var(--secondary-text-color);">
            <b style="color:var(--primary-text-color);">Lifetime tokens:</b> ${lifetimeTokens === null ? '—' : lifetimeTokens.toLocaleString(locale)}<br>
            <b style="color:var(--primary-text-color);">Threads:</b> ${totalThreads === null ? '—' : totalThreads.toLocaleString(locale)}<br>
            <b style="color:var(--primary-text-color);">Current streak:</b> ${currentStreak === null ? '—' : `${currentStreak} days`}<br>
            <b style="color:var(--primary-text-color);">Fast mode:</b> ${fastMode === null ? '—' : `${formatNumber(fastMode, 0)}%`}<br>
            <b style="color:var(--primary-text-color);">Top reasoning:</b> ${reasoning ?? '—'}${reasoningShare === null ? '' : ` (${formatNumber(reasoningShare, 0)}%)`}
          </div>`;
      }

      return `
        <div style="width:100%;box-sizing:border-box;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
            <div style="min-width:0;">
              <div style="font-size:20px;font-weight:850;color:var(--primary-text-color);">Codex Usage</div>
              <div style="margin-top:2px;font-size:12px;color:var(--secondary-text-color);">${plan}</div>
            </div>
            <div style="flex:none;padding:7px 10px;border:1px solid ${statusColor}77;border-radius:999px;background:${statusColor}18;color:${statusColor};font-size:11px;font-weight:700;white-space:nowrap;">● ${status}</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-top:15px;">
            ${usagePanel('5-HOUR LIMIT', variables.five_hour_usage_entity, variables.five_hour_remaining_entity, variables.five_hour_reset_entity)}
            ${usagePanel('WEEKLY LIMIT', variables.weekly_usage_entity, variables.weekly_remaining_entity, variables.weekly_reset_entity)}
            ${panel('WEEKLY PACE', paceBody)}
            ${panel('RESET TIMES', resetsBody)}
            ${panel('CREDITS', creditBody)}
            ${panel('SPENDING', spendBody)}
            ${panel('PROFILE STATISTICS', profileBody)}
          </div>
        </div>`;
    ]]]
