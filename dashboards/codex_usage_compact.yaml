# Replace every example entity ID below with the ID from Developer Tools > States.
type: custom:button-card
variables:
  plan_entity: sensor.codex_usage_plan
  five_hour_usage_entity: sensor.codex_usage_5_hour_usage
  five_hour_reset_entity: sensor.codex_usage_5_hour_reset
  weekly_usage_entity: sensor.codex_usage_weekly_usage
  weekly_reset_entity: sensor.codex_usage_weekly_reset
  rate_limit_entity: binary_sensor.codex_usage_rate_limit_reached
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
hold_action:
  action: none
styles:
  card:
    - padding: 16px
    - border-radius: 20px
    - background: var(--ha-card-background, var(--card-background-color))
    - border: 1px solid var(--divider-color)
    - box-shadow: var(--ha-card-box-shadow, none)
  grid:
    - grid-template-areas: '"summary"'
    - grid-template-columns: 1fr
  custom_fields:
    summary:
      - grid-area: summary
      - width: 100%
custom_fields:
  summary: |
    [[[
      const missing = new Set(['', 'unknown', 'unavailable']);
      const raw = (id) => states[id]?.state;
      const present = (value) => value !== undefined && value !== null
        && !missing.has(String(value).toLowerCase());
      const number = (id) => {
        const value = raw(id);
        if (!present(value)) return null;
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : null;
      };
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[character]);
      const clamp = (value) => Math.max(0, Math.min(100, value));
      const usageColor = (value) => value >= 90 ? '#ef4444' : value >= 75 ? '#f59e0b' : '#38bdf8';
      const locale = hass.locale?.language || hass.language || navigator.language;
      const formatReset = (id) => {
        const value = raw(id);
        if (!present(value)) return null;
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return null;
        return {
          date,
          label: date.toLocaleString(locale, {
            weekday: 'short', day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit'
          })
        };
      };
      const renderUsage = (label, value) => {
        if (value === null) return `
          <div style="min-width:0;flex:1;padding:12px;border-radius:15px;background:var(--secondary-background-color);">
            <div style="font-size:11px;font-weight:700;color:var(--secondary-text-color);">${label}</div>
            <div style="margin-top:8px;font-size:15px;font-weight:700;color:var(--secondary-text-color);">Not reported</div>
          </div>`;
        const color = usageColor(value);
        return `
          <div style="min-width:0;flex:1;padding:12px;border-radius:15px;background:var(--secondary-background-color);">
            <div style="font-size:11px;font-weight:700;color:var(--secondary-text-color);">${label}</div>
            <div style="margin-top:5px;font-size:24px;font-weight:800;color:var(--primary-text-color);">${value.toFixed(0)}%</div>
            <div style="height:7px;margin-top:9px;overflow:hidden;border-radius:999px;background:var(--divider-color);">
              <div style="height:100%;width:${clamp(value)}%;border-radius:999px;background:${color};"></div>
            </div>
          </div>`;
      };

      const fiveHour = number(variables.five_hour_usage_entity);
      const weekly = number(variables.weekly_usage_entity);
      const limitReached = raw(variables.rate_limit_entity) === 'on';
      const planRaw = raw(variables.plan_entity);
      const plan = present(planRaw) ? escapeHtml(planRaw) : 'Plan not reported';
      const maximum = Math.max(fiveHour ?? -1, weekly ?? -1);

      let status = 'Available';
      let statusColor = '#22c55e';
      if (limitReached) {
        status = 'Limit reached';
        statusColor = '#ef4444';
      } else if (fiveHour === null && weekly === null) {
        status = 'No usage data';
        statusColor = '#94a3b8';
      } else if (maximum >= 90) {
        status = 'Almost full';
        statusColor = '#ef4444';
      } else if (maximum >= 75) {
        status = 'High usage';
        statusColor = '#f59e0b';
      }

      const resets = [
        formatReset(variables.five_hour_reset_entity),
        formatReset(variables.weekly_reset_entity)
      ].filter(Boolean).sort((left, right) => left.date - right.date);
      const nextReset = resets.length ? `Next reset: ${escapeHtml(resets[0].label)}` : 'Reset time not reported';

      return `
        <div style="width:100%;box-sizing:border-box;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
            <div style="min-width:0;">
              <div style="font-size:18px;font-weight:800;color:var(--primary-text-color);">Codex Usage</div>
              <div style="margin-top:2px;font-size:12px;color:var(--secondary-text-color);">${plan}</div>
            </div>
            <div style="flex:none;padding:6px 9px;border:1px solid ${statusColor}77;border-radius:999px;background:${statusColor}18;color:${statusColor};font-size:11px;font-weight:700;white-space:nowrap;">
              ● ${status}
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:14px;">
            ${renderUsage('5-HOUR', fiveHour)}
            ${renderUsage('WEEKLY', weekly)}
          </div>
          <div style="margin-top:11px;font-size:11px;color:var(--secondary-text-color);">${nextReset}</div>
        </div>`;
    ]]]
